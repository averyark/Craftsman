[package]
name = "averyark/craftsman"
version = "0.3.5"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
authors = ["averyark"]
license = "MIT"
description = "Craftsman is a proprietary lightweight roblox scripting framework and scripting kit."
exclude = [
    "test/**",
    "aftman.toml",
    "wally.lock",
    "stylua.toml",
    ".gitignore",
    ".gitattributes",
    ".luaurc",
    "Agent.md"
]

[dependencies]
Promise = "howmanysmall/typed-promise@4.0.6"
ByteNet = "elitriare/bytenet-max@0.2.5"
Reflex = "littensy/reflex@4.3.1"
DocumentService = "anthony0br/documentservice@1.2.2"
Signal = "sleitnick/signal@2.0.3"
Spr = "kiy4ku/spr@2.1.0"
Keeper = "averyark/keeper@1.9.1"
